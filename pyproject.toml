[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samad-food-monitor"
version = "1.0.0"
description = "سیستم هوشمند پایش و اطلاع‌رسانی انتشار برنامه غذایی هفته آینده دانشگاه شهید بهشتی (سماد)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Samad Food Monitor Contributors" }
]
dependencies = [
    "playwright>=1.48.0",
    "httpx>=0.27.0",
    "socksio>=1.0.0",
    "jdatetime>=5.0.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
samad-monitor = "samad_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"samad_monitor.ui.static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
